<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SAM Audio Pipeline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1014;
        --panel: #181b21;
        --panel-2: #20242b;
        --line: #2d323b;
        --muted: #969da9;
        --text: #f5f7fa;
        --accent: #83efbf;
        --danger: #ff7777;
        --warn: #ffd479;
        --music: #bd9cff;
        --voice: #77b9ff;
        --sfx: #ffae76;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(circle at 20% -10%, #25312e 0, transparent 35%), var(--bg);
        color: var(--text);
        font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button, input, select { font: inherit; }
      .shell { width: min(1380px, calc(100% - 32px)); margin: 0 auto; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 25px 0 18px; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
      h2 { margin-bottom: 8px; }
      nav { display: flex; gap: 8px; }
      button {
        border: 1px solid var(--line); border-radius: 9px; padding: 9px 13px;
        background: var(--panel-2); color: var(--text); cursor: pointer;
      }
      button:hover, button.active { border-color: var(--accent); color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #08120e; font-weight: 700; }
      button.danger { border-color: #713b3b; color: var(--danger); }
      button:disabled { cursor: wait; opacity: .55; }
      main { padding-bottom: 60px; }
      .view[hidden] { display: none; }
      .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
      .metrics { grid-template-columns: repeat(6, 1fr); margin: 14px 0; }
      .card { background: color-mix(in srgb, var(--panel) 95%, transparent); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
      .queue-name, .eyebrow { color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-size: 11px; }
      .queue-count, .metric-value { font-size: 29px; font-weight: 760; margin-top: 7px; line-height: 1.15; }
      .queue-detail, .metric-detail, .muted { color: var(--muted); margin-top: 3px; }
      .upload, .dataset-toolbar { margin: 18px 0; display: flex; align-items: center; gap: 12px; }
      input[type=file] { flex: 1; border: 1px dashed #414753; border-radius: 10px; padding: 12px; color: var(--muted); }
      select { border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; background: var(--panel-2); color: var(--text); min-width: 190px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
      tbody tr { cursor: pointer; }
      tbody tr:hover { background: #20242a; }
      .status { display: inline-flex; border-radius: 999px; padding: 3px 9px; background: #242932; }
      .status.success, .status.complete, .status.stems_ready { color: var(--accent); }
      .status.failure, .status.failed { color: var(--danger); }
      .status.uncertain, .status.partial { color: var(--warn); }
      .review-progress { max-width: 820px; margin: 4vh auto 14px; display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
      .review-progress .card { padding: 13px 16px; }
      .review-progress strong { display: block; font-size: 24px; }
      .review { max-width: 820px; margin: 0 auto; text-align: center; }
      .review h2 { font-size: clamp(25px, 4vw, 42px); line-height: 1.12; margin: 14px 0 8px; }
      .prompt { color: var(--muted); font-size: 17px; margin-bottom: 24px; }
      audio { width: 100%; height: 38px; display: block; }
      .review audio { margin: 10px 0 24px; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .actions button { padding: 20px; font-size: 17px; }
      .pending { margin-top: 12px; width: 100%; }
      .key { display: inline-grid; place-items: center; width: 24px; height: 24px; border: 1px solid currentColor; border-radius: 5px; margin-right: 8px; font-size: 12px; }
      pre { text-align: left; white-space: pre-wrap; color: #bac0ca; background: #111318; padding: 14px; border-radius: 9px; overflow: auto; }
      .empty { color: var(--muted); padding: 45px 0; text-align: center; }
      #notice { min-height: 24px; color: var(--muted); }
      .dataset-title { margin-right: auto; }
      .dataset-title h2 { margin: 0; }
      .explorer { display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 14px; align-items: start; }
      .source-list { padding: 8px; max-height: 72vh; overflow: auto; position: sticky; top: 12px; }
      .source-item { width: 100%; text-align: left; padding: 12px; border: 0; border-bottom: 1px solid var(--line); border-radius: 8px; background: transparent; }
      .source-item.active { background: #26302d; color: var(--accent); }
      .source-item strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .source-item small { color: var(--muted); }
      .source-header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 16px; }
      .source-header > div { min-width: 0; }
      .source-header h2 { overflow-wrap: anywhere; }
      .source-meta { color: var(--muted); }
      .source-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
      .mode-toggle { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: #111318; }
      .mode-toggle button { border: 0; padding: 6px 10px; background: transparent; }
      .mode-toggle button.active { background: #26302d; }
      .track-stack { border: 1px solid #3a404a; border-radius: 16px; overflow: hidden; background: #111318; }
      .track-row { display: grid; grid-template-columns: 125px minmax(0, 1fr); min-height: 64px; border-top: 1px solid var(--line); }
      .track-row:first-child { border-top: 0; }
      .track-label { padding: 15px; border-right: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; color: var(--muted); }
      .track-label b { color: var(--text); font-size: 13px; letter-spacing: 0; text-transform: none; }
      .track-body { padding: 12px 14px; display: flex; align-items: center; min-width: 0; }
      .track-row.original { background: #1d2228; }
      .track-row.music .track-label { border-left: 4px solid var(--music); }
      .track-row.voice .track-label { border-left: 4px solid var(--voice); }
      .track-row.sfx .track-label { border-left: 4px solid var(--sfx); }
      .chunk { margin-top: 15px; }
      .chunk-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 4px 7px; color: var(--muted); font-size: 12px; }
      .stereo-maps { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 8px; }
      .stereo-map { padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; background: #13161a; }
      .stereo-map-head { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11px; margin-bottom: 5px; }
      .stereo-map svg { display: block; width: 100%; height: 58px; }
      .stereo-map .center-line { stroke: #59606b; stroke-width: 1; stroke-dasharray: 4 4; }
      .stereo-map .pan-line { fill: none; stroke-width: 2.5; vector-effect: non-scaling-stroke; }
      .stereo-map-foot { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; }
      .gate-skip { border: 1px dashed var(--line); border-radius: 12px; padding: 20px; color: var(--muted); text-align: center; }
      .pipeline-overview { margin-top: 16px; }
      .steps { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
      .step { padding: 7px 10px; border-radius: 999px; background: #252a31; color: var(--muted); font-size: 12px; }
      .step.complete, .step.success { color: var(--accent); }
      .step.failure, .step.failed { color: var(--danger); }
      .step.uncertain { color: var(--warn); }
      .annotations { display: grid; gap: 8px; }
      .annotation { padding: 12px; background: #13161a; border-radius: 9px; }
      .annotation b { color: var(--accent); }
      @media (max-width: 980px) { .metrics { grid-template-columns: repeat(3, 1fr); } .explorer { grid-template-columns: 1fr; } .source-list { position: static; max-height: 280px; } }
      @media (max-width: 700px) { .grid, .metrics { grid-template-columns: 1fr 1fr; } .upload, .dataset-toolbar, header { align-items: stretch; flex-direction: column; } .track-row { grid-template-columns: 90px 1fr; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>SAM Audio Pipeline</h1>
        <nav>
          <button id="dashboard-tab" class="active">Pipeline</button>
          <button id="data-tab">Split data</button>
          <button id="review-tab">Review <span id="review-badge"></span></button>
        </nav>
      </header>
      <main>
        <section id="dashboard" class="view">
          <div id="queues" class="grid"></div>
          <div class="card upload">
            <select id="dataset" aria-label="Dataset"></select>
            <button id="new-dataset">New dataset</button>
            <input id="files" type="file" accept="audio/*" multiple />
            <button id="submit" class="primary">Upload & queue</button>
          </div>
          <div id="notice"></div>
          <div class="card">
            <table>
              <thead><tr><th>Job</th><th>Status</th><th>Files</th><th>Created</th></tr></thead>
              <tbody id="jobs"></tbody>
            </table>
          </div>
        </section>

        <section id="data" class="view" hidden>
          <div class="card dataset-toolbar">
            <div class="dataset-title"><div class="eyebrow">Dataset overview</div><h2 id="dataset-name">Dataset</h2></div>
            <select id="data-dataset" aria-label="Dataset to inspect"></select>
            <button id="refresh-dataset">Refresh</button>
          </div>
          <div id="dataset-metrics" class="grid metrics"></div>
          <div class="explorer">
            <div id="source-list" class="card source-list"></div>
            <div id="source-detail" class="card"><div class="empty">Select a sound to inspect its split.</div></div>
          </div>
        </section>

        <section id="review" class="view" hidden>
          <div id="review-progress" class="review-progress"></div>
          <div id="review-card" class="card review"></div>
        </section>
      </main>
    </div>
    <script>
      const $ = selector => document.querySelector(selector);
      let currentReview = null;
      let currentDataset = null;
      let currentSourceId = null;
      let currentJobId = null;
      let stereoMappingEnabled = true;
      let activeView = "dashboard";

      function escapeHtml(value) {
        const node = document.createElement("div");
        node.textContent = value ?? "";
        return node.innerHTML;
      }

      function formatBytes(bytes) {
        const value = Number(bytes || 0);
        if (!value) return "0 B";
        const units = ["B", "KB", "MB", "GB", "TB"];
        const power = Math.min(Math.floor(Math.log(value) / Math.log(1024)), units.length - 1);
        return `${(value / 1024 ** power).toFixed(power ? 1 : 0)} ${units[power]}`;
      }

      function formatDuration(seconds) {
        const value = Math.round(Number(seconds || 0));
        const hours = Math.floor(value / 3600);
        const minutes = Math.floor((value % 3600) / 60);
        const remainder = value % 60;
        return hours ? `${hours}h ${minutes}m` : `${minutes}m ${remainder}s`;
      }

      function show(view) {
        activeView = view;
        for (const name of ["dashboard", "data", "review"]) {
          $(`#${name}`).hidden = view !== name;
          $(`#${name}-tab`).classList.toggle("active", view === name);
        }
        if (view === "review") loadReview();
        if (view === "data") loadDataset();
      }

      async function refresh() {
        const response = await fetch("/v1/overview");
        if (!response.ok) return;
        const data = await response.json();
        const cards = Object.entries(data.queues).map(([name, queue]) => `
          <div class="card">
            <div class="queue-name">${escapeHtml(name.replace("_", " "))}</div>
            <div class="queue-count">${queue.queued}</div>
            <div class="queue-detail">waiting · ${queue.in_flight} processing</div>
          </div>`);
        cards.push(`<div class="card"><div class="queue-name">Review</div><div class="queue-count">${data.review_queue.total}</div><div class="queue-detail">${data.review_queue.failure} failed · ${data.review_queue.uncertain} uncertain</div></div>`);
        $("#queues").innerHTML = cards.join("");
        $("#review-badge").textContent = data.review_queue.total ? `(${data.review_queue.total})` : "";
        $("#jobs").innerHTML = data.jobs.map(job => `
          <tr onclick="openJob('${escapeHtml(job.job_id)}', '${escapeHtml(job.dataset_id)}')">
            <td><code>${escapeHtml(job.job_id.slice(0, 12))}</code></td>
            <td><span class="status ${escapeHtml(job.status)}">${escapeHtml(job.status)}</span></td>
            <td>${job.source_count}</td>
            <td>${new Date(job.created_at).toLocaleString()}</td>
          </tr>`).join("") || '<tr><td colspan="4" class="empty">No jobs yet.</td></tr>';
      }

      async function loadDatasets(selected) {
        const response = await fetch("/v1/datasets");
        if (!response.ok) return;
        const datasets = await response.json();
        const options = datasets.map(dataset => `<option value="${escapeHtml(dataset.dataset_id)}">${escapeHtml(dataset.name)}</option>`).join("");
        $("#dataset").innerHTML = options;
        $("#data-dataset").innerHTML = options;
        const value = selected || $("#dataset").value || datasets[0]?.dataset_id;
        if (value) {
          $("#dataset").value = value;
          $("#data-dataset").value = value;
        }
      }

      async function newDataset() {
        const name = prompt("Dataset name");
        if (!name?.trim()) return;
        const response = await fetch("/v1/datasets", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({name: name.trim()})
        });
        if (!response.ok) return alert(await response.text());
        const dataset = await response.json();
        await loadDatasets(dataset.dataset_id);
      }

      async function submitFiles() {
        const files = [...$("#files").files];
        if (!files.length) return;
        $("#submit").disabled = true;
        $("#notice").textContent = `Preparing ${files.length} upload(s)…`;
        try {
          const create = await fetch("/v1/jobs", {
            method: "POST", headers: {"Content-Type": "application/json"},
            body: JSON.stringify({dataset_id: $("#dataset").value, filenames: files.map(file => file.name)})
          });
          if (!create.ok) throw new Error(await create.text());
          const job = await create.json();
          for (let index = 0; index < files.length; index++) {
            $("#notice").textContent = `Uploading ${index + 1}/${files.length}: ${files[index].name}`;
            const upload = await fetch(job.uploads[index].upload_url, {
              method: "PUT", headers: {"Content-Type": job.uploads[index].content_type}, body: files[index]
            });
            if (!upload.ok) throw new Error(`Upload failed: ${files[index].name}`);
          }
          const complete = await fetch(`/v1/jobs/${job.job_id}/uploads-complete`, {
            method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"
          });
          if (!complete.ok) throw new Error(await complete.text());
          $("#notice").textContent = `${files.length} file(s) accepted. Processing continues durably in the background.`;
          $("#files").value = "";
          await refresh();
        } catch (error) {
          $("#notice").textContent = error.message;
        } finally {
          $("#submit").disabled = false;
        }
      }

      function metric(label, value, detail = "") {
        return `<div class="card"><div class="eyebrow">${escapeHtml(label)}</div><div class="metric-value">${escapeHtml(value)}</div><div class="metric-detail">${escapeHtml(detail)}</div></div>`;
      }

      async function loadDataset(preferredSource) {
        const datasetId = $("#data-dataset").value || $("#dataset").value;
        if (!datasetId) return;
        $("#dataset").value = datasetId;
        const response = await fetch(`/v1/datasets/${encodeURIComponent(datasetId)}/overview`);
        if (!response.ok) return;
        currentDataset = await response.json();
        const summary = currentDataset.summary;
        $("#dataset-name").textContent = currentDataset.dataset.name;
        $("#dataset-metrics").innerHTML = [
          metric("Sounds", summary.sources, `${summary.jobs} upload job(s) · ${summary.non_stereo_sources || 0} non-stereo skipped`),
          metric("Duration", formatDuration(summary.duration_seconds), "original audio"),
          metric("Storage", formatBytes(summary.total_bytes), `${formatBytes(summary.input_bytes)} originals · ${formatBytes(summary.chunk_bytes)} chunks · ${formatBytes(summary.stem_bytes)} raw stems · ${formatBytes(summary.stereo_bytes)} stereo`),
          metric("Chunks", summary.chunks, `${summary.skipped_chunks} sound-gated`),
          metric("Stems", summary.stems, `${Object.entries(summary.stems_by_type).map(([key, value]) => `${value} ${key}`).join(" · ")} · ${summary.stereo_stems} stereo mapped`),
          metric("Needs review", summary.review_remaining, "failure + uncertain")
        ].join("");
        $("#source-list").innerHTML = currentDataset.sources.map(source => {
          const needsReview = (source.stem_statuses.failure || 0) + (source.stem_statuses.uncertain || 0);
          const route = source.selected_order ? ` · ${source.selected_order.replace("_", " ")}` : "";
          const skipped = source.skip_reason === "non_stereo_input" ? " · skipped: input is not stereo" : "";
          return `<button class="source-item ${source.source_id === currentSourceId ? "active" : ""}" data-source="${escapeHtml(source.source_id)}" onclick="loadSource('${escapeHtml(source.job_id)}', '${escapeHtml(source.source_id)}')">
            <strong>${escapeHtml(source.filename)}</strong>
            <small>${escapeHtml(source.pipeline_status)} · ${formatDuration(source.duration_seconds)} · ${source.stem_count} stem(s)${escapeHtml(route)}${escapeHtml(skipped)}${needsReview ? ` · ${needsReview} need review` : ""}</small>
          </button>`;
        }).join("") || '<div class="empty">No uploaded sounds yet.</div>';
        const target = preferredSource || currentSourceId;
        const source = currentDataset.sources.find(item => item.source_id === target) || currentDataset.sources[0];
        if (source) await loadSource(source.job_id, source.source_id);
      }

      async function openJob(jobId, datasetId) {
        await loadDatasets(datasetId);
        show("data");
        const source = currentDataset?.sources.find(item => item.job_id === jobId);
        if (source) await loadSource(source.job_id, source.source_id);
      }

      function trackRow(kind, label, subtitle, rawUrl, stereoUrl = null) {
        if (!rawUrl) return "";
        const mapped = stereoMappingEnabled && stereoUrl;
        const mode = stereoUrl ? (mapped ? " · stereo mapped" : " · raw") : "";
        const url = mapped ? stereoUrl : rawUrl;
        return `<div class="track-row ${escapeHtml(kind)}"><div class="track-label"><b>${escapeHtml(label)}</b>${escapeHtml(subtitle + mode)}</div><div class="track-body"><audio controls preload="metadata" src="${escapeHtml(url)}"></audio></div></div>`;
      }

      function panSide(value) {
        const pan = Number(value || 0);
        if (pan < -.08) return `${Math.round(Math.abs(pan) * 100)}% left`;
        if (pan > .08) return `${Math.round(pan * 100)}% right`;
        return "center";
      }

      function stereoMapCard(stem) {
        const mapping = stem.stereo_mapping || {};
        const curve = mapping.pan_curve || [];
        if (!curve.length) return "";
        const width = 360;
        const height = 58;
        const duration = Math.max(...curve.map(point => Number(point.time_seconds || 0)), 1);
        const points = curve.map(point => {
          const x = Number(point.time_seconds || 0) / duration * width;
          const y = height / 2 - Number(point.pan || 0) * (height / 2 - 3);
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(" ");
        const summary = mapping.pan_summary || {};
        const color = {music: "var(--music)", voice: "var(--voice)", sfx: "var(--sfx)"}[stem.stem_type] || "var(--accent)";
        const mappingLabel = mapping.tonal_transfer === "identity"
          ? "identity · no EQ"
          : `${mapping.frequency_bands || "–"} bands · EMA ${mapping.smoothing?.alpha ?? "–"} · broadband gain`;
        return `<div class="stereo-map"><div class="stereo-map-head"><b>${escapeHtml(stem.stem_type)} stereo map</b><span>${escapeHtml(mappingLabel)}</span></div><svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-label="Smoothed left-right trajectory"><line class="center-line" x1="0" y1="${height / 2}" x2="${width}" y2="${height / 2}"></line><polyline class="pan-line" style="stroke:${color}" points="${points}"></polyline></svg><div class="stereo-map-foot"><span>starts ${panSide(summary.start)}</span><span>ends ${panSide(summary.end)}</span></div></div>`;
      }

      function setStereoMapping(enabled) {
        stereoMappingEnabled = enabled;
        if (currentJobId && currentSourceId) loadSource(currentJobId, currentSourceId);
      }

      async function loadSource(jobId, sourceId) {
        currentJobId = jobId;
        currentSourceId = sourceId;
        document.querySelectorAll(".source-item").forEach(item => item.classList.toggle("active", item.dataset.source === sourceId));
        $("#source-detail").innerHTML = '<div class="empty">Loading sound and stems…</div>';
        const response = await fetch(`/v1/jobs/${encodeURIComponent(jobId)}/sources/${encodeURIComponent(sourceId)}`);
        if (!response.ok) return;
        const data = await response.json();
        const source = data.source;
        const provenance = source.source_metadata || {};
        const labels = provenance.label_names || provenance.labels || [];
        const provenanceText = provenance.video_id
          ? `AudioSet · ${labels.join(", ") || "labelled sound"} · source ${provenance.start_seconds}s–${provenance.end_seconds}s`
          : `${formatDuration(source.duration_seconds)} · ${formatBytes(source.bytes)}`;
        const original = trackRow("original", "Original", "OG sound", source.audio_url);
        const sourceSkip = source.skip_reason === "non_stereo_input"
          ? '<div class="chunk"><div class="chunk-head"><span>Input filter</span><span class="status">skipped</span></div><div class="gate-skip">This source was not processed because the pipeline accepts exactly two-channel stereo input.</div></div>'
          : "";
        const hasStereo = data.chunks.some(chunk => chunk.stems.some(stem => stem.stereo_audio_url));
        const chunks = data.chunks.map(chunk => {
          if (chunk.status === "skipped") {
            return `<div class="chunk"><div class="chunk-head"><span>Chunk ${escapeHtml(chunk.chunk_id)} · ${chunk.start_seconds}s–${chunk.end_seconds}s</span><span class="status">sound-gated</span></div><div class="gate-skip">No audible signal passed the gate, so no stems were generated.</div></div>`;
          }
          const route = chunk.stems[0]?.settings?.adaptive_routing?.selected_order;
          const rows = chunk.stems.map(stem => {
            const labelsByType = {music: ["Music", "music stem"], voice: ["Voice", "dialogue stem"], sfx: ["Residual", "SFX / ambience"]};
            const [label, subtitle] = labelsByType[stem.stem_type] || [stem.stem_type, "stem"];
            return trackRow(stem.stem_type, label, `${subtitle} · ${stem.effective_status}`, stem.audio_url, stem.stereo_audio_url);
          }).join("");
          const stereoMaps = chunk.stems.map(stereoMapCard).join("");
          const gate = chunk.gate ? ` · peak ${Number(chunk.gate.peak_dbfs).toFixed(1)} dBFS` : "";
          return `<div class="chunk"><div class="chunk-head"><span>Chunk ${escapeHtml(chunk.chunk_id)} · ${chunk.start_seconds}s–${chunk.end_seconds}s${escapeHtml(gate)}</span><span>${route ? escapeHtml(route.replace("_", " ")) : escapeHtml(chunk.status)}</span></div><div class="track-stack">${rows || '<div class="gate-skip">All generated stems were below the output sound gate.</div>'}</div>${stereoMaps ? `<div class="stereo-maps">${stereoMaps}</div>` : ""}</div>`;
        }).join("");
        const steps = [
          ["source", source.pipeline_status],
          ...data.chunks.map(chunk => [`chunk ${chunk.chunk_id}`, chunk.status]),
          ...data.chunks.flatMap(chunk => chunk.stems.map(stem => [`${stem.stem_type} stem`, stem.effective_status])),
          ...data.model_tasks.map(task => [task.task_type.replaceAll("_", " "), task.status])
        ].map(([label, status]) => `<span class="step ${escapeHtml(status)}">${escapeHtml(label)} · ${escapeHtml(status)}</span>`).join("");
        const annotations = data.annotations.map(annotation => `<div class="annotation"><b>${escapeHtml(annotation.task_type.replaceAll("_", " "))}</b><div>${escapeHtml(annotation.text)}</div></div>`).join("");
        $("#source-detail").innerHTML = `
          <div class="source-header"><div><div class="eyebrow">Sound detail</div><h2>${escapeHtml(source.filename)}</h2><div class="source-meta">${escapeHtml(provenanceText)}</div></div><div class="source-actions">${hasStereo ? `<div class="mode-toggle" aria-label="Stem playback mode"><button class="${stereoMappingEnabled ? "" : "active"}" onclick="setStereoMapping(false)">Raw</button><button class="${stereoMappingEnabled ? "active" : ""}" onclick="setStereoMapping(true)">Stereo mapped</button></div>` : ""}<span class="status ${escapeHtml(source.pipeline_status)}">${escapeHtml(source.pipeline_status)}</span></div></div>
          <div class="track-stack">${original || '<div class="gate-skip">Original upload is not available.</div>'}</div>
          ${sourceSkip}
          ${chunks}
          <div class="card pipeline-overview"><div class="eyebrow">How it moved through the pipeline</div><div class="steps">${steps}</div><div class="annotations">${annotations || '<div class="muted">No model annotations yet.</div>'}</div></div>`;
      }

      async function loadReviewStats() {
        const response = await fetch("/v1/review/stats");
        if (!response.ok) return;
        const stats = await response.json();
        $("#review-progress").innerHTML = `
          <div class="card"><span class="eyebrow">Left to review</span><strong>${stats.total}</strong></div>
          <div class="card"><span class="eyebrow">Failures</span><strong>${stats.failure}</strong></div>
          <div class="card"><span class="eyebrow">Uncertain</span><strong>${stats.uncertain}</strong></div>`;
        $("#review-badge").textContent = stats.total ? `(${stats.total})` : "";
      }

      async function loadReview() {
        await loadReviewStats();
        $("#review-card").innerHTML = '<div class="empty">Loading next item…</div>';
        const response = await fetch("/v1/review/next");
        currentReview = response.ok ? await response.json() : null;
        if (!currentReview) {
          $("#review-card").innerHTML = '<div class="empty">Review queue is clear.</div>';
          return;
        }
        const item = currentReview;
        $("#review-card").innerHTML = `
          <div class="eyebrow">${escapeHtml(item.stem_type)} · automatic ${escapeHtml(item.automatic_status)}</div>
          <h2>${escapeHtml(item.assertion)}</h2>
          <div class="prompt">Prompt: “${escapeHtml(item.prompt)}”</div>
          <audio id="review-audio" src="${escapeHtml(item.audio_url)}" controls autoplay></audio>
          <div class="actions"><button class="primary" onclick="decide('pass')"><span class="key">1</span>Correct</button><button class="danger" onclick="decide('fail')"><span class="key">2</span>Incorrect</button></div>
          <button class="pending" onclick="decide('pending')"><span class="key">3</span>Keep pending</button>
          <details><summary>Scores and timings</summary><pre>${escapeHtml(JSON.stringify({scores: item.scores, timings_ms: item.timings_ms}, null, 2))}</pre></details>`;
        $("#review-audio").play().catch(() => {});
      }

      async function decide(decision) {
        if (!currentReview) return;
        const response = await fetch(`/v1/review/${encodeURIComponent(currentReview.review_id)}`, {
          method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({decision})
        });
        if (!response.ok) return alert(await response.text());
        currentReview = null;
        await loadReview();
      }

      $("#dashboard-tab").onclick = () => show("dashboard");
      $("#data-tab").onclick = () => show("data");
      $("#review-tab").onclick = () => show("review");
      $("#submit").onclick = submitFiles;
      $("#new-dataset").onclick = newDataset;
      $("#refresh-dataset").onclick = () => loadDataset(currentSourceId);
      $("#dataset").onchange = event => { $("#data-dataset").value = event.target.value; };
      $("#data-dataset").onchange = event => { $("#dataset").value = event.target.value; currentSourceId = null; loadDataset(); };
      document.addEventListener("keydown", event => {
        if (activeView !== "review" || !currentReview || event.repeat) return;
        if (event.key === "1") decide("pass");
        if (event.key === "2") decide("fail");
        if (event.key === "3") decide("pending");
        if (event.key === " ") { event.preventDefault(); const audio = $("#review-audio"); audio.paused ? audio.play() : audio.pause(); }
      });
      loadDatasets().then(refresh);
      setInterval(() => {
        if (activeView === "dashboard") refresh();
        if (activeView === "review") loadReviewStats();
      }, 5000);
    </script>
  </body>
</html>
