[project]
name = "sam-audio-pipeline"
version = "0.1.0"
description = "Durable AWS control plane for the SAM Audio stem pipeline"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
    "fastapi>=0.116",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35",
    "yt-dlp>=2026.5",
]

[project.scripts]
sam-pipeline-api = "sam_audio_pipeline.api:main"
sam-pipeline-worker = "sam_audio_pipeline.worker:main"
sam-pipeline-audioset = "sam_audio_pipeline.audioset:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sam_audio_pipeline"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
